<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Indoor navigation for the College of Science, KNUST" />
    <meta name="theme-color" content="#0b6e3b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="COS Nav" />
    <title>COS Indoor Navigation</title>
    <style>
      /* Loading screen: shown before the app's JavaScript has loaded. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b6e3b;
        color: #ffffff;
        font-family: Inter, 'Segoe UI', sans-serif;
        transition: opacity 0.45s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 108px;
        height: 108px;
        border-radius: 26px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
        animation: splash-pop 0.6s ease-out;
      }
      #splash h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: 0.01em;
      }
      #splash p {
        margin: -10px 0 0;
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.85rem;
      }
      #splash .bar {
        position: relative;
        width: 160px;
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
      }
      #splash .bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 999px;
        background: #f5c518;
        animation: splash-load 1.1s ease-in-out infinite;
      }
      /* The owner's logo: a faint watermark near the bottom of the screen */
      #splash .owner {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
        width: auto;
        height: 56px;
        max-width: 60vw;
        border-radius: 0;
        box-shadow: none;
        object-fit: contain;
        opacity: 1;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.35));
        animation: none;
      }
      @keyframes splash-load {
        from { transform: translateX(-100%); }
        to { transform: translateX(260%); }
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.85); }
        to { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading COS Indoor Navigation">
      <img src="/brand/logo.svg" alt="" />
      <h1>COS Indoor Navigation</h1>
      <p>College of Science · KNUST</p>
      <div class="bar"></div>
      <img class="owner" src="/brand/owner-logo.png" alt="" onerror="this.remove()" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
